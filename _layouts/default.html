<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  <!-- CSS links -->
  <link rel="stylesheet" href="{{ '/css/Index.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/projects.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/Global.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/footer.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/service.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/about.css' | relative_url }}">
  
</head>
<body>

  <!-- header -->
  {% include header.html %}


  <!-- Page content -->
  <main class="site-content">
    {{ content }}
  </main>
  
  <!-- footer -->
  {% include footer.html %}

<script>
  function closeMenu() {
    const navLinks = document.querySelector('.nav-links');
    const toggleButton = document.querySelector('.nav-toggle');
    if (!navLinks || !toggleButton) return;

    navLinks.classList.remove("is-open");
    toggleButton.setAttribute("aria-expanded", "false");
  }

  function toggleMenu() {
    const navLinks = document.querySelector('.nav-links');
    const toggleButton = document.querySelector('.nav-toggle');
    if (!navLinks || !toggleButton) return;

    const isOpen = navLinks.classList.toggle("is-open");
    toggleButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  // Toggle menu when button is clicked
  document.addEventListener("DOMContentLoaded", () => {
    const toggleButton = document.querySelector(".nav-toggle");
    if (toggleButton) {
      toggleButton.addEventListener("click", toggleMenu);
    }

    const navLinks = document.querySelector(".nav-links");
    if (navLinks) {
      // Close menu when clicking a link inside it
      navLinks.querySelectorAll("a").forEach((a) => {
        a.addEventListener("click", closeMenu);
      });
    }
  });

  // Close menu when clicking outside
  document.addEventListener("click", (e) => {
    const navLinks = document.querySelector('.nav-links');
    const toggleButton = document.querySelector('.nav-toggle');
    if (!navLinks || !toggleButton) return;

    const clickedToggle = toggleButton.contains(e.target);
    const clickedInsideMenu = navLinks.contains(e.target);

    if (!clickedToggle && !clickedInsideMenu) closeMenu();
  });
</script>
  

</body>
</html>
